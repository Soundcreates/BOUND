<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOUND request warning</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="warning warning-timeline">
  <main>
    <section class="request-timeline" aria-label="Wallet request">
      <h1 class="timeline-heading">BOUND</h1>
      <ol class="timeline">
        <li class="timeline-step timeline-domain"><span class="timeline-dot" aria-hidden="true"></span><span>Your report of <strong id="report-domain">loading site…</strong></span></li>
        <li class="timeline-step timeline-time"><span class="timeline-dot" aria-hidden="true"></span><span id="request-time">Waiting for request details…</span></li>
        <li class="timeline-step timeline-actions"><span class="timeline-dot" aria-hidden="true"></span><div class="timeline-controls">
          <label id="confirmation-label" for="confirmation" hidden>Type <code>I UNDERSTAND</code> to continue this escalated request</label>
          <input id="confirmation" autocomplete="off" hidden>
          <button id="continue" disabled>Continue transaction</button>
          <button id="cancel">Cancel transaction</button>
          <p id="request-status" role="status" hidden></p>
        </div></li>
      </ol>
    </section>
    <section class="warning-data" hidden>
      <p id="notice"></p><p id="incident" hidden></p>
      <h1>Wallet request</h1><span id="verdict"></span>
      <section id="connection-field" hidden><div id="connection-calc"></div><span id="connection-formula"></span></section>
      <span id="coverage"></span><span id="top"></span><span id="frame"></span><span id="method"></span><span id="chain"></span><span id="target"></span><span id="entries"></span>
      <div id="frontend"></div><div id="network-capture"></div>
      <span id="observed-field" hidden><span id="observed"></span></span>
      <section id="approval-links" hidden><div id="approval-pairs"></div></section>
      <span id="ens-field" hidden><span id="ens"></span></span><span id="reasons"></span>
    </section>
  </main>
  <script src="warning.js"></script>
</body>
</html>
